<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GOONA — Dompet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* Latar belakang ragam ikon pekerjaan bernuansa biru elektrik samar */
    .work-icons-bg {
      background-color: #f4f7fc;
      background-image:
        radial-gradient(circle at 15% 15%, rgba(37, 99, 235, 0.06) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(29, 78, 216, 0.05) 0%, transparent 45%),
        url("data:image/svg+xml,%3Csvg width='140' height='140' viewBox='0 0 140 140' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%232563eb' stroke-opacity='0.075' stroke-width='1.35' stroke-linecap='round' stroke-linejoin='round'%3E%3C!-- Koper kerja --%3E%3Cg transform='translate(16,18) rotate(-12)'%3E%3Crect x='2' y='7' width='20' height='14' rx='2.5'/%3E%3Cpath d='M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2'/%3E%3Cpath d='M2 12h20'/%3E%3C/g%3E%3C!-- Catatan / checklist review --%3E%3Cg transform='translate(88,16) rotate(14)'%3E%3Crect x='3' y='3' width='16' height='20' rx='2'/%3E%3Cpath d='M7 8h8M7 12h8M7 16h5'/%3E%3C/g%3E%3C!-- Grafik naik --%3E%3Cg transform='translate(54,56) rotate(-8)'%3E%3Cpath d='M3 19V5M3 19h16'/%3E%3Cpath d='m7 14 4-4 3 2 5-6'/%3E%3C/g%3E%3C!-- Lencana / penghargaan kerja --%3E%3Cg transform='translate(20,94) rotate(10)'%3E%3Ccircle cx='12' cy='9' r='6'/%3E%3Cpath d='m9 14.5-1.5 6.5L12 19l4.5 2L15 14.5'/%3E%3C/g%3E%3C!-- Megafon / promosi --%3E%3Cg transform='translate(92,92) rotate(-14)'%3E%3Cpath d='M4 11v2a2 2 0 0 0 2 2h1l5 4V7l-5 4H6a2 2 0 0 0-2 2z'/%3E%3Cpath d='M16 10a4 4 0 0 1 0 6'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      background-size: 100% 100%, 100% 100%, 140px 140px;
    }
  </style>
</head>
<body class="work-icons-bg h-dvh w-screen overflow-hidden text-slate-900 antialiased flex flex-col">
  <!-- Header -->
  <header class="shrink-0 z-20 border-b border-blue-100/90 bg-white/92 backdrop-blur-md">
    <div class="mx-auto flex max-w-md items-center justify-between gap-2 px-4 py-2.5">
      <div class="min-w-0">
        <div class="text-xl font-black leading-none tracking-tight text-blue-600">
          GOONA
        </div>
        <p class="mt-1 truncate text-[11px] font-medium text-slate-500">
          Dompet &amp; Saldo
        </p>
      </div>

      <span id="account-badge" class="shrink-0 rounded-full border border-blue-200 bg-blue-50 px-3 py-1 text-[11px] font-bold text-blue-700">
        Tamu
      </span>
    </div>
  </header>

  <!-- Area Tengah: Bisa Di-Scroll Ke Bawah -->
  <main class="flex-1 min-h-0 overflow-y-auto mx-auto w-full max-w-md px-3.5 py-3 space-y-3">
    <!-- Kartu Saldo Utama -->
    <section class="rounded-3xl bg-gradient-to-br from-blue-600 to-blue-700 p-4 text-white shadow-md shadow-blue-600/15 space-y-3">
      <div class="flex items-center justify-between">
        <span class="text-xs font-semibold text-blue-100">Saldo Saat Ini</span>
        <i data-lucide="wallet" class="h-4 w-4 text-blue-100"></i>
      </div>

      <div id="balance-amount" class="text-2xl font-black tracking-tight tabular-nums">
        Rp 0
      </div>

      <div class="grid grid-cols-2 gap-2 pt-1">
        <button
          id="open-withdraw-btn"
          type="button"
          class="inline-flex items-center justify-center gap-1.5 rounded-2xl bg-white px-3 py-2 text-xs font-extrabold text-blue-700 transition hover:bg-blue-50 active:scale-[0.99]"
        >
          <i data-lucide="arrow-up-right" class="h-4 w-4"></i>
          <span>Tarik Saldo</span>
        </button>

        <button
          id="open-topup-btn"
          type="button"
          class="inline-flex items-center justify-center gap-1.5 rounded-2xl border border-blue-300/60 bg-blue-500/40 px-3 py-2 text-xs font-extrabold text-white transition hover:bg-blue-500/60 active:scale-[0.99]"
        >
          <i data-lucide="arrow-down-left" class="h-4 w-4"></i>
          <span>Top Up / Deposit</span>
        </button>
      </div>
    </section>

    <!-- Panel Aksi Tarik Saldo / Top Up (Muncul Saat Ditekan) -->
    <section id="action-panel" class="hidden rounded-3xl border border-blue-100 bg-white/95 p-4 shadow-sm space-y-3">
      <div class="flex items-center justify-between">
        <h2 id="action-panel-title" class="text-xs font-extrabold text-slate-900">Aksi Dompet</h2>
        <button id="close-action-btn" type="button" class="text-slate-400 hover:text-slate-700" aria-label="Tutup">
          <i data-lucide="x" class="h-4 w-4"></i>
        </button>
      </div>

      <div id="deposit-note" class="hidden rounded-2xl border border-blue-100 bg-blue-50/70 p-2.5 text-[11px] font-medium text-blue-900">
        Deposit mulai Rp 100.000 mendapatkan 100 orang real.
      </div>

      <form id="wallet-action-form" class="space-y-2.5">
        <div>
          <label for="amount-input" class="block text-[11px] font-bold text-slate-700 mb-1">
            Nominal (Rupiah)
          </label>
          <input
            id="amount-input"
            type="number"
            min="10000"
            step="1000"
            placeholder="Contoh: 100000"
            required
            class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-xs font-bold text-slate-900 focus:border-blue-500 focus:bg-white focus:outline-none"
          />
        </div>

        <div id="destination-wrapper">
          <label id="destination-label" for="destination-input" class="block text-[11px] font-bold text-slate-700 mb-1">
            Tujuan Rekening / E-Wallet
          </label>
          <input
            id="destination-input"
            type="text"
            placeholder="Nama bank/e-wallet & nomor tujuan"
            class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-xs font-medium text-slate-900 focus:border-blue-500 focus:bg-white focus:outline-none"
          />
        </div>

        <button
          id="submit-action-btn"
          type="submit"
          class="w-full rounded-xl bg-blue-600 px-3 py-2 text-xs font-extrabold text-white transition hover:bg-blue-700 disabled:opacity-50"
        >
          Kirim Permintaan
        </button>
      </form>

      <div id="action-feedback" class="min-h-[16px] text-[11px] font-semibold text-slate-500"></div>
    </section>

    <!-- Riwayat Mutasi (Kosong Alami Saat Belum Ada Transaksi) -->
    <section class="rounded-3xl border border-blue-100/90 bg-white/95 p-4 shadow-sm space-y-2.5">
      <div class="flex items-center justify-between">
        <h2 class="text-xs font-extrabold text-slate-900">Riwayat Mutasi</h2>
        <span class="text-[11px] font-medium text-slate-400">Terbaru</span>
      </div>

      <div id="mutations-list" class="space-y-2">
        <div id="empty-mutations" class="rounded-2xl border border-dashed border-slate-200 bg-slate-50/70 p-5 text-center space-y-1">
          <div class="mx-auto flex h-9 w-9 items-center justify-center rounded-2xl bg-blue-50 text-blue-600">
            <i data-lucide="receipt-text" class="h-4 w-4"></i>
          </div>
          <p class="text-xs font-bold text-slate-700">
            Belum ada riwayat transaksi.
          </p>
        </div>
      </div>
    </section>
  </main>

  <!-- Navigasi Bawah: 5 Ikon -->
  <nav class="shrink-0 z-20 border-t border-blue-100 bg-white/95 backdrop-blur-md">
    <div class="mx-auto flex max-w-md items-center justify-between px-3 py-2">
      <!-- 1. Icon Rumah -> index.html -->
      <a
        href="index.html"
        aria-label="Beranda"
        class="flex h-11 w-12 items-center justify-center rounded-2xl text-slate-500 transition hover:bg-blue-50 hover:text-blue-600"
      >
        <i data-lucide="home" class="h-5 w-5"></i>
      </a>

      <!-- 2. Icon Dompet -> dompet.html (Aktif) -->
      <a
        href="dompet.html"
        aria-label="Dompet"
        class="flex h-11 w-12 items-center justify-center rounded-2xl bg-blue-600 text-white shadow-sm transition"
      >
        <i data-lucide="wallet" class="h-5 w-5"></i>
      </a>

      <!-- 3. Icon Pasang Iklan -> iklan.html -->
      <a
        href="iklan.html"
        aria-label="Pasang Iklan"
        class="flex h-11 w-12 items-center justify-center rounded-2xl text-slate-500 transition hover:bg-blue-50 hover:text-blue-600"
      >
        <i data-lucide="plus-circle" class="h-5 w-5"></i>
      </a>

      <!-- 4. Icon Riwayat -> riwayat.html -->
      <a
        href="riwayat.html"
        aria-label="Riwayat Review"
        class="flex h-11 w-12 items-center justify-center rounded-2xl text-slate-500 transition hover:bg-blue-50 hover:text-blue-600"
      >
        <i data-lucide="history" class="h-5 w-5"></i>
      </a>

      <!-- 5. Icon Orang (Sudut Kanan Bawah) -> profil.html -->
      <a
        href="profil.html"
        aria-label="Profil"
        class="flex h-11 w-12 items-center justify-center rounded-2xl text-slate-500 transition hover:bg-blue-50 hover:text-blue-600"
      >
        <i data-lucide="user" class="h-5 w-5"></i>
      </a>
    </div>
  </nav>

  <script>
    lucide.createIcons();
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-analytics.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
    import {
      getFirestore,
      collection,
      doc,
      getDoc,
      addDoc,
      query,
      where,
      limit,
      onSnapshot,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAa_EhwILQsTrJBKocpvT8gHTholmCLMTY",
      authDomain: "goona-app.firebaseapp.com",
      projectId: "goona-app",
      storageBucket: "goona-app.firebasestorage.app",
      messagingSenderId: "315162973072",
      appId: "1:315162973072:web:bd7244e1bfc13ce1ae1915",
      measurementId: "G-GXVPP73QCK"
    };

    const app = initializeApp(firebaseConfig);
    getAnalytics(app);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let currentBalance = 0;
    let mode = "withdraw";
    let unsubUser = null;
    let unsubTx = null;

    function formatRupiah(amount = 0) {
      return "Rp " + Number(amount || 0).toLocaleString("id-ID");
    }

    function escapeHtml(text = "") {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function openPanel(nextMode) {
      mode = nextMode;
      const panel = document.getElementById("action-panel");
      const title = document.getElementById("action-panel-title");
      const depositNote = document.getElementById("deposit-note");
      const destWrapper = document.getElementById("destination-wrapper");
      const destLabel = document.getElementById("destination-label");
      const destInput = document.getElementById("destination-input");
      const amountInput = document.getElementById("amount-input");
      const feedback = document.getElementById("action-feedback");

      feedback.textContent = "";
      feedback.className = "min-h-[16px] text-[11px] font-semibold text-slate-500";
      amountInput.value = "";
      destInput.value = "";

      if (mode === "withdraw") {
        title.textContent = "Tarik Saldo";
        depositNote.classList.add("hidden");
        destWrapper.classList.remove("hidden");
        destLabel.textContent = "Tujuan Rekening / E-Wallet";
        destInput.placeholder = "Contoh: BCA 1234567890 a.n. Nama";
        amountInput.min = "10000";
      } else {
        title.textContent = "Top Up / Deposit";
        depositNote.classList.remove("hidden");
        destWrapper.classList.remove("hidden");
        destLabel.textContent = "Catatan / Referensi Pembayaran";
        destInput.placeholder = "Opsional";
        amountInput.min = "100000";
      }

      panel.classList.remove("hidden");
    }

    function renderMutations(docs = []) {
      const listEl = document.getElementById("mutations-list");
      if (!docs.length) {
        listEl.innerHTML = `
          <div id="empty-mutations" class="rounded-2xl border border-dashed border-slate-200 bg-slate-50/70 p-5 text-center space-y-1">
            <div class="mx-auto flex h-9 w-9 items-center justify-center rounded-2xl bg-blue-50 text-blue-600">
              <i data-lucide="receipt-text" class="h-4 w-4"></i>
            </div>
            <p class="text-xs font-bold text-slate-700">
              Belum ada riwayat transaksi.
            </p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      const sorted = [...docs].sort((a, b) => {
        const ta = a.data()?.createdAt?.toMillis?.() || 0;
        const tb = b.data()?.createdAt?.toMillis?.() || 0;
        return tb - ta;
      });

      listEl.innerHTML = sorted
        .map((d) => {
          const item = d.data() || {};
          const isDeposit = item.type === "topup" || item.type === "deposit";
          const label = isDeposit ? "Top Up / Deposit" : "Tarik Saldo";
          const status = escapeHtml(item.status || "Menunggu");
          const amountText = formatRupiah(item.amount || 0);
          const sign = isDeposit ? "+" : "-";
          const amountColor = isDeposit ? "text-blue-700" : "text-slate-800";

          return `
            <div class="flex items-center justify-between gap-2 rounded-2xl border border-slate-100 bg-slate-50/80 px-3 py-2.5">
              <div class="min-w-0">
                <div class="truncate text-xs font-bold text-slate-800">${label}</div>
                <div class="truncate text-[10px] font-medium text-slate-500">Status: ${status}</div>
              </div>
              <div class="shrink-0 text-xs font-extrabold tabular-nums ${amountColor}">
                ${sign}${amountText}
              </div>
            </div>
          `;
        })
        .join("");
    }

    function detachListeners() {
      if (unsubUser) {
        unsubUser();
        unsubUser = null;
      }
      if (unsubTx) {
        unsubTx();
        unsubTx = null;
      }
    }

    document.getElementById("open-withdraw-btn")?.addEventListener("click", () => openPanel("withdraw"));
    document.getElementById("open-topup-btn")?.addEventListener("click", () => openPanel("topup"));
    document.getElementById("close-action-btn")?.addEventListener("click", () => {
      document.getElementById("action-panel")?.classList.add("hidden");
    });

    document.getElementById("wallet-action-form")?.addEventListener("submit", async (e) => {
      e.preventDefault();
      const feedback = document.getElementById("action-feedback");
      const amount = Number(document.getElementById("amount-input")?.value || 0);
      const destination = (document.getElementById("destination-input")?.value || "").trim();

      if (!currentUser) {
        feedback.className = "min-h-[16px] text-[11px] font-bold text-rose-600";
        feedback.innerHTML = 'Silakan masuk akun terlebih dahulu di <a href="profil.html" class="underline">Profil</a>.';
        return;
      }

      if (mode === "withdraw") {
        if (amount <= 0 || amount > currentBalance) {
          feedback.className = "min-h-[16px] text-[11px] font-bold text-rose-600";
          feedback.textContent = "Nominal melebihi saldo atau tidak valid.";
          return;
        }
        if (!destination) {
          feedback.className = "min-h-[16px] text-[11px] font-bold text-rose-600";
          feedback.textContent = "Lengkapi tujuan rekening atau e-wallet.";
          return;
        }
      } else if (amount < 100000) {
        feedback.className = "min-h-[16px] text-[11px] font-bold text-rose-600";
        feedback.textContent = "Deposit minimal Rp 100.000.";
        return;
      }

      try {
        await addDoc(collection(db, "wallet_transactions"), {
          userId: currentUser.uid,
          type: mode,
          amount,
          destination,
          status: "pending",
          createdAt: serverTimestamp()
        });
        feedback.className = "min-h-[16px] text-[11px] font-bold text-blue-700";
        feedback.textContent = "Permintaan tercatat. Menunggu pemrosesan.";
        document.getElementById("amount-input").value = "";
        document.getElementById("destination-input").value = "";
      } catch {
        feedback.className = "min-h-[16px] text-[11px] font-bold text-rose-600";
        feedback.textContent = "Gagal mengirim permintaan.";
      }
    });

    onAuthStateChanged(auth, async (user) => {
      detachListeners();
      currentUser = user;
      const badge = document.getElementById("account-badge");
      const balanceEl = document.getElementById("balance-amount");

      if (!user) {
        currentBalance = 0;
        badge.textContent = "Tamu";
        balanceEl.textContent = formatRupiah(0);
        renderMutations([]);
        return;
      }

      badge.textContent = "Akun Aktif";

      try {
        const snap = await getDoc(doc(db, "users", user.uid));
        if (snap.exists()) {
          currentBalance = Number(snap.data()?.balance || 0);
          balanceEl.textContent = formatRupiah(currentBalance);
        }
      } catch {}

      unsubUser = onSnapshot(doc(db, "users", user.uid), (snap) => {
        if (snap.exists()) {
          currentBalance = Number(snap.data()?.balance || 0);
          balanceEl.textContent = formatRupiah(currentBalance);
        }
      });

      const txQuery = query(
        collection(db, "wallet_transactions"),
        where("userId", "==", user.uid),
        limit(30)
      );

      unsubTx = onSnapshot(
        txQuery,
        (snap) => {
          renderMutations(snap.docs);
        },
        () => {
          renderMutations([]);
        }
      );
    });
  </script>
</body>
</html>
