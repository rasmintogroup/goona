<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GOONA — Mulai Langkahmu Sebagai Reviewer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* Latar belakang ragam ikon pekerjaan bernuansa biru elektrik samar */
    .work-icons-bg {
      background-color: #f4f7fc;
      background-image:
        radial-gradient(circle at 15% 15%, rgba(37, 99, 235, 0.06) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(29, 78, 216, 0.05) 0%, transparent 45%),
        url("data:image/svg+xml,%3Csvg width='140' height='140' viewBox='0 0 140 140' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%232563eb' stroke-opacity='0.075' stroke-width='1.35' stroke-linecap='round' stroke-linejoin='round'%3E%3C!-- Koper kerja --%3E%3Cg transform='translate(16,18) rotate(-12)'%3E%3Crect x='2' y='7' width='20' height='14' rx='2.5'/%3E%3Cpath d='M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2'/%3E%3Cpath d='M2 12h20'/%3E%3C/g%3E%3C!-- Catatan / checklist review --%3E%3Cg transform='translate(88,16) rotate(14)'%3E%3Crect x='3' y='3' width='16' height='20' rx='2'/%3E%3Cpath d='M7 8h8M7 12h8M7 16h5'/%3E%3C/g%3E%3C!-- Grafik naik --%3E%3Cg transform='translate(54,56) rotate(-8)'%3E%3Cpath d='M3 19V5M3 19h16'/%3E%3Cpath d='m7 14 4-4 3 2 5-6'/%3E%3C/g%3E%3C!-- Lencana / penghargaan kerja --%3E%3Cg transform='translate(20,94) rotate(10)'%3E%3Ccircle cx='12' cy='9' r='6'/%3E%3Cpath d='m9 14.5-1.5 6.5L12 19l4.5 2L15 14.5'/%3E%3C/g%3E%3C!-- Megafon / promosi --%3E%3Cg transform='translate(92,92) rotate(-14)'%3E%3Cpath d='M4 11v2a2 2 0 0 0 2 2h1l5 4V7l-5 4H6a2 2 0 0 0-2 2z'/%3E%3Cpath d='M16 10a4 4 0 0 1 0 6'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      background-size: 100% 100%, 100% 100%, 140px 140px;
    }
  </style>
</head>
<body class="work-icons-bg h-dvh w-screen overflow-hidden text-slate-900 antialiased flex flex-col">
  <!-- Header: GOONA Besar, Tagline Kecil, Lonceng (Kiri) & Jumlah Reviewer (Kanan Atas) -->
  <header class="shrink-0 z-20 border-b border-blue-100/90 bg-white/92 backdrop-blur-md">
    <div class="mx-auto flex max-w-md items-center justify-between gap-2 px-4 py-2.5">
      <div class="min-w-0">
        <div class="text-xl font-black leading-none tracking-tight text-blue-600">
          GOONA
        </div>
        <p class="mt-1 truncate text-[11px] font-medium text-slate-500">
          Mulai Langkahmu Sebagai Reviewer
        </p>
      </div>

      <div class="shrink-0 flex flex-col items-end gap-1">
        <div class="flex items-center gap-1.5">
          <!-- Icon Lonceng di Sebelah Kiri Icon Orang -->
          <a
            href="notifikasi.html"
            aria-label="Pemberitahuan"
            class="inline-flex h-8 w-8 items-center justify-center rounded-full border border-blue-200 bg-blue-50/80 text-blue-600 transition hover:bg-blue-100"
            title="Pemberitahuan"
          >
            <i data-lucide="bell" class="h-4 w-4"></i>
          </a>

          <!-- Icon Orang + Angka Reviewer Terdaftar -->
          <a
            href="profil.html"
            aria-label="Jumlah Reviewer Terdaftar"
            class="inline-flex items-center gap-1.5 rounded-full border border-blue-200 bg-blue-600 px-3 py-1.5 text-white shadow-sm transition hover:bg-blue-700"
            title="Reviewer Terdaftar"
          >
            <i data-lucide="user-check" class="h-4 w-4 text-blue-100"></i>
            <span id="reviewer-count" class="text-xs font-extrabold tabular-nums">0</span>
          </a>
        </div>
        <span id="daily-quota-label" class="text-[10px] font-semibold tabular-nums text-slate-500">
          Batas: 0/15 hari ini
        </span>
      </div>
    </div>

    <!-- Baris Filter (Muncul Saat Ada Kampanye Aktif) -->
    <div id="filter-bar" class="hidden mx-auto max-w-md px-4 pb-2.5">
      <div class="grid grid-cols-3 gap-1.5 rounded-xl bg-blue-50/90 p-1 border border-blue-100">
        <button
          type="button"
          data-filter="all"
          class="filter-btn rounded-lg bg-blue-600 py-1 text-[11px] font-bold text-white shadow-sm transition"
        >
          Semua
        </button>
        <button
          type="button"
          data-filter="eligible"
          class="filter-btn rounded-lg py-1 text-[11px] font-semibold text-slate-600 transition hover:text-blue-700"
        >
          Bisa Di-Review
        </button>
        <button
          type="button"
          data-filter="ineligible"
          class="filter-btn rounded-lg py-1 text-[11px] font-semibold text-slate-600 transition hover:text-blue-700"
        >
          Tidak Bisa
        </button>
      </div>
    </div>
  </header>

  <!-- Area Tengah: Bisa Di-Scroll Saat Ada Layanan; Pesan Kosong Otomatis Muncul/Hilang -->
  <main id="feed-container" class="flex-1 min-h-0 overflow-y-auto mx-auto w-full max-w-md px-3.5 py-3 space-y-3">
    <div id="empty-state-box" class="rounded-3xl border border-blue-100 bg-white/92 p-5 text-center shadow-sm space-y-1.5">
      <div class="mx-auto flex h-10 w-10 items-center justify-center rounded-2xl bg-blue-50 text-blue-600">
        <i data-lucide="inbox" class="h-5 w-5"></i>
      </div>
      <p class="text-xs font-bold text-slate-800">
        Belum ada layanan yang tersedia untuk di-review.
      </p>
      <p class="text-[11px] text-slate-500">
        Maksimal 15 review per hari per akun.
      </p>
    </div>
  </main>

  <!-- Navigasi Bawah: 5 Ikon -->
  <nav class="shrink-0 z-20 border-t border-blue-100 bg-white/95 backdrop-blur-md">
    <div class="mx-auto flex max-w-md items-center justify-between px-3 py-2">
      <!-- 1. Icon Rumah -> index.html -->
      <a
        href="index.html"
        aria-label="Beranda"
        class="flex h-11 w-12 items-center justify-center rounded-2xl bg-blue-600 text-white shadow-sm transition"
      >
        <i data-lucide="home" class="h-5 w-5"></i>
      </a>

      <!-- 2. Icon Dompet -> dompet.html -->
      <a
        href="dompet.html"
        aria-label="Dompet"
        class="flex h-11 w-12 items-center justify-center rounded-2xl text-slate-500 transition hover:bg-blue-50 hover:text-blue-600"
      >
        <i data-lucide="wallet" class="h-5 w-5"></i>
      </a>

      <!-- 3. Icon Pasang Iklan -> iklan.html -->
      <a
        href="iklan.html"
        aria-label="Pasang Iklan"
        class="flex h-11 w-12 items-center justify-center rounded-2xl text-slate-500 transition hover:bg-blue-50 hover:text-blue-600"
      >
        <i data-lucide="plus-circle" class="h-5 w-5"></i>
      </a>

      <!-- 4. Icon Riwayat -> riwayat.html -->
      <a
        href="riwayat.html"
        aria-label="Riwayat Review"
        class="flex h-11 w-12 items-center justify-center rounded-2xl text-slate-500 transition hover:bg-blue-50 hover:text-blue-600"
      >
        <i data-lucide="history" class="h-5 w-5"></i>
      </a>

      <!-- 5. Icon Orang (Sudut Kanan Bawah) -> profil.html -->
      <a
        href="profil.html"
        aria-label="Profil"
        class="flex h-11 w-12 items-center justify-center rounded-2xl text-slate-500 transition hover:bg-blue-50 hover:text-blue-600"
      >
        <i data-lucide="user" class="h-5 w-5"></i>
      </a>
    </div>
  </nav>

  <script>
    lucide.createIcons();
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-analytics.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
    import {
      getFirestore,
      collection,
      doc,
      getDoc,
      getDocs,
      addDoc,
      query,
      where,
      limit,
      onSnapshot,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAa_EhwILQsTrJBKocpvT8gHTholmCLMTY",
      authDomain: "goona-app.firebaseapp.com",
      projectId: "goona-app",
      storageBucket: "goona-app.firebasestorage.app",
      messagingSenderId: "315162973072",
      appId: "1:315162973072:web:bd7244e1bfc13ce1ae1915",
      measurementId: "G-GXVPP73QCK"
    };

    const app = initializeApp(firebaseConfig);
    getAnalytics(app);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const DAILY_REVIEW_LIMIT = 15;
    const MAX_DESC_LENGTH = 150;

    let currentUser = null;
    let userProfile = null;
    let dailyReviewCount = 0;
    let activeFilter = "all";
    let campaigns = [];
    const activeTimers = new Map();

    function getTodayKey() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, "0");
      const d = String(now.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function escapeHtml(text = "") {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function sanitizeUrl(rawUrl = "") {
      try {
        const parsed = new URL(rawUrl);
        if (parsed.protocol === "https:" || parsed.protocol === "http:") {
          return parsed.href;
        }
      } catch {}
      return "";
    }

    function truncateDesc(text = "") {
      const clean = String(text).trim();
      if (!clean) return "Konten layanan perusahaan.";
      return clean.length > MAX_DESC_LENGTH
        ? clean.slice(0, MAX_DESC_LENGTH).trimEnd() + "..."
        : clean;
    }

    function updateDailyQuotaUi() {
      const el = document.getElementById("daily-quota-label");
      if (!el) return;
      el.textContent = `Batas: ${dailyReviewCount}/${DAILY_REVIEW_LIMIT} hari ini`;
    }

    async function loadDailyReviewCount(uid) {
      if (!uid) {
        dailyReviewCount = 0;
        updateDailyQuotaUi();
        return;
      }
      try {
        const today = getTodayKey();
        const q = query(
          collection(db, "reviews"),
          where("reviewerId", "==", uid),
          where("dateKey", "==", today)
        );
        const snap = await getDocs(q);
        dailyReviewCount = snap.size;
      } catch {
        dailyReviewCount = 0;
      }
      updateDailyQuotaUi();
    }

    function checkEligibility(data) {
      if (dailyReviewCount >= DAILY_REVIEW_LIMIT) {
        return {
          eligible: false,
          reason: `Batas harian tercapai (${DAILY_REVIEW_LIMIT}/${DAILY_REVIEW_LIMIT})`
        };
      }

      if (!currentUser) {
        return {
          eligible: false,
          reason: "Masuk akun untuk me-review"
        };
      }

      const targetCat = (data.kategori || data.category || "").toString().trim().toLowerCase();
      if (targetCat && targetCat !== "semua" && targetCat !== "all") {
        const userCat = (userProfile?.kategori || userProfile?.category || "").toString().trim().toLowerCase();
        if (!userCat || userCat !== targetCat) {
          return {
            eligible: false,
            reason: `Kategori belum sesuai (${data.kategori || data.category})`
          };
        }
      }

      return {
        eligible: true,
        reason: "Bisa di-review"
      };
    }

    function clearAllTimers() {
      activeTimers.forEach((id) => clearInterval(id));
      activeTimers.clear();
    }

    function renderEmptyMessage() {
      clearAllTimers();
      document.getElementById("filter-bar").classList.add("hidden");
      document.getElementById("feed-container").innerHTML = `
        <div id="empty-state-box" class="rounded-3xl border border-blue-100 bg-white/92 p-5 text-center shadow-sm space-y-1.5">
          <div class="mx-auto flex h-10 w-10 items-center justify-center rounded-2xl bg-blue-50 text-blue-600">
            <i data-lucide="inbox" class="h-5 w-5"></i>
          </div>
          <p class="text-xs font-bold text-slate-800">
            Belum ada layanan yang tersedia untuk di-review.
          </p>
          <p class="text-[11px] text-slate-500">
            Maksimal 15 review per hari per akun.
          </p>
        </div>
      `;
      lucide.createIcons();
    }

    function renderCampaigns() {
      clearAllTimers();
      const container = document.getElementById("feed-container");
      const filterBar = document.getElementById("filter-bar");

      if (!campaigns.length) {
        renderEmptyMessage();
        return;
      }

      filterBar.classList.remove("hidden");

      const enriched = campaigns.map((docSnap) => {
        const data = docSnap.data() || {};
        return {
          id: docSnap.id,
          data,
          elig: checkEligibility(data)
        };
      });

      const filtered = enriched.filter((item) => {
        if (activeFilter === "eligible") return item.elig.eligible;
        if (activeFilter === "ineligible") return !item.elig.eligible;
        return true;
      });

      if (!filtered.length) {
        container.innerHTML = `
          <div class="rounded-3xl border border-blue-100 bg-white/92 p-5 text-center shadow-sm">
            <p class="text-xs font-bold text-slate-700">
              Tidak ada layanan pada filter ini.
            </p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered
        .map(({ id, data, elig }) => {
          const title = escapeHtml(data.judul || data.title || "Layanan Perusahaan");
          const desc = escapeHtml(truncateDesc(data.deskripsi || data.description || ""));
          const location = escapeHtml(data.lokasi || data.location || "Semua Wilayah");
          const category = escapeHtml(data.kategori || data.category || "Umum");
          const safeImg = sanitizeUrl(data.gambarUrl || data.imageUrl || data.gambar || "");
          const safeLink = sanitizeUrl(data.linkPenjualan || data.salesUrl || data.link || "");
          const question = escapeHtml(data.pertanyaan || data.question || "Apakah informasi layanan ini jelas?");
          const optA = escapeHtml(data.opsiA || data.optionA || "A. Ya, jelas");
          const optB = escapeHtml(data.opsiB || data.optionB || "B. Kurang jelas");

          const badgeClass = elig.eligible
            ? "bg-blue-50 text-blue-700 border-blue-200"
            : "bg-slate-100 text-slate-600 border-slate-200";

          return `
            <article data-card-id="${escapeHtml(id)}" class="rounded-3xl border border-blue-100/90 bg-white/95 p-3.5 shadow-sm space-y-2.5">
              <div class="flex items-center justify-between gap-2">
                <span class="rounded-full bg-blue-50 px-2.5 py-0.5 text-[11px] font-bold text-blue-700">
                  ${category}
                </span>
                <span class="truncate rounded-full border px-2.5 py-0.5 text-[11px] font-bold ${badgeClass}">
                  ${escapeHtml(elig.reason)}
                </span>
              </div>

              ${
                safeImg
                  ? `<div class="h-44 w-full overflow-hidden rounded-2xl bg-slate-100 border border-slate-200/70">
                       <img src="${safeImg}" alt="${title}" class="h-full w-full object-cover" loading="lazy" />
                     </div>`
                  : ""
              }

              <div class="space-y-1">
                <h2 class="text-sm font-extrabold text-slate-900">${title}</h2>
                <p class="text-xs leading-relaxed text-slate-600">${desc}</p>
                <div class="flex items-center justify-between gap-2 pt-1 text-[11px]">
                  <span class="inline-flex items-center gap-1 font-medium text-slate-500 truncate">
                    <i data-lucide="map-pin" class="h-3.5 w-3.5 text-blue-600 shrink-0"></i>
                    <span class="truncate">${location}</span>
                  </span>
                  ${
                    safeLink
                      ? `<a href="${safeLink}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 font-bold text-blue-600 hover:underline shrink-0">
                           <span>Link Penjualan</span>
                           <i data-lucide="external-link" class="h-3 w-3"></i>
                         </a>`
                      : ""
                  }
                </div>
              </div>

              <div class="rounded-2xl border border-slate-200/80 bg-slate-50/90 p-2.5 space-y-2">
                <div class="flex items-center justify-between gap-2">
                  <span class="text-[11px] font-bold text-slate-800">${question}</span>
                  <span data-timer-badge class="shrink-0 rounded-full bg-amber-100 px-2 py-0.5 text-[10px] font-bold tabular-nums text-amber-800">
                    ${elig.eligible ? "7d" : "Terkunci"}
                  </span>
                </div>
                <div class="grid grid-cols-2 gap-2">
                  <button
                    type="button"
                    data-choice="A"
                    disabled
                    class="choice-btn rounded-xl border border-slate-300 bg-white px-2.5 py-2 text-left text-xs font-bold text-slate-800 transition hover:border-blue-500 hover:bg-blue-50 disabled:opacity-50 disabled:cursor-not-allowed truncate"
                  >
                    ${optA}
                  </button>
                  <button
                    type="button"
                    data-choice="B"
                    disabled
                    class="choice-btn rounded-xl border border-slate-300 bg-white px-2.5 py-2 text-left text-xs font-bold text-slate-800 transition hover:border-blue-500 hover:bg-blue-50 disabled:opacity-50 disabled:cursor-not-allowed truncate"
                  >
                    ${optB}
                  </button>
                </div>
                <div data-status-msg class="min-h-[15px] text-[11px] font-semibold text-slate-500"></div>
              </div>
            </article>
          `;
        })
        .join("");

      lucide.createIcons();

      container.querySelectorAll("article[data-card-id]").forEach((card) => {
        const cardId = card.getAttribute("data-card-id");
        const found = filtered.find((x) => x.id === cardId);
        if (!found || !found.elig.eligible) return;

        let remaining = 7;
        const badge = card.querySelector("[data-timer-badge]");
        const buttons = card.querySelectorAll(".choice-btn");
        const statusMsg = card.querySelector("[data-status-msg]");

        const timerId = setInterval(() => {
          remaining -= 1;
          if (badge) {
            badge.textContent = remaining > 0 ? `${remaining}d` : "Siap";
            if (remaining <= 0) {
              badge.className = "shrink-0 rounded-full bg-blue-100 px-2 py-0.5 text-[10px] font-bold text-blue-700";
            }
          }
          if (remaining <= 0) {
            clearInterval(timerId);
            activeTimers.delete(cardId);
            buttons.forEach((btn) => {
              btn.disabled = false;
            });
          }
        }, 1000);

        activeTimers.set(cardId, timerId);

        buttons.forEach((btn) => {
          btn.addEventListener("click", async () => {
            if (!currentUser || dailyReviewCount >= DAILY_REVIEW_LIMIT) return;
            const choice = btn.getAttribute("data-choice");
            buttons.forEach((b) => (b.disabled = true));

            try {
              await addDoc(collection(db, "reviews"), {
                campaignId: cardId,
                reviewerId: currentUser.uid,
                answer: choice,
                dateKey: getTodayKey(),
                createdAt: serverTimestamp()
              });
              dailyReviewCount += 1;
              updateDailyQuotaUi();
              if (statusMsg) {
                statusMsg.className = "min-h-[15px] text-[11px] font-bold text-blue-700";
                statusMsg.textContent = `Pilihan ${choice} tersimpan (${dailyReviewCount}/${DAILY_REVIEW_LIMIT} hari ini).`;
              }
            } catch {
              if (statusMsg) {
                statusMsg.className = "min-h-[15px] text-[11px] font-bold text-rose-600";
                statusMsg.textContent = "Gagal menyimpan review.";
              }
            }
          });
        });
      });
    }

    document.querySelectorAll(".filter-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        activeFilter = btn.getAttribute("data-filter") || "all";
        document.querySelectorAll(".filter-btn").forEach((b) => {
          const isActive = b === btn;
          b.className = isActive
            ? "filter-btn rounded-lg bg-blue-600 py-1 text-[11px] font-bold text-white shadow-sm transition"
            : "filter-btn rounded-lg py-1 text-[11px] font-semibold text-slate-600 transition hover:text-blue-700";
        });
        renderCampaigns();
      });
    });

    function listenReviewerCount() {
      const countEl = document.getElementById("reviewer-count");
      try {
        const q = query(collection(db, "users"), where("role", "==", "reviewer"));
        onSnapshot(
          q,
          (snap) => {
            countEl.textContent = Number(snap.size || 0).toLocaleString("id-ID");
          },
          () => {
            countEl.textContent = "0";
          }
        );
      } catch {
        countEl.textContent = "0";
      }
    }

    function listenActiveCampaigns() {
      try {
        const q = query(collection(db, "campaigns"), where("status", "==", "active"), limit(30));
        onSnapshot(
          q,
          (snap) => {
            campaigns = snap.docs;
            renderCampaigns();
          },
          () => {
            campaigns = [];
            renderEmptyMessage();
          }
        );
      } catch {
        campaigns = [];
        renderEmptyMessage();
      }
    }

    onAuthStateChanged(auth, async (user) => {
      currentUser = user;
      userProfile = null;
      if (user) {
        try {
          const userSnap = await getDoc(doc(db, "users", user.uid));
          if (userSnap.exists()) userProfile = userSnap.data();
        } catch {}
        await loadDailyReviewCount(user.uid);
      } else {
        dailyReviewCount = 0;
        updateDailyQuotaUi();
      }
      renderCampaigns();
    });

    listenReviewerCount();
    listenActiveCampaigns();
  </script>
</body>
</html>
