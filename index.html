<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Goona - Direktori Layanan</title>
    <link rel="icon" type="image/png" href="Pavicon_goona.png">
    <style>
        :root {
            --primary-brown: #8B4513;
            --secondary-brown: #A0522D;
            --light-brown: #D2B48C;
            --bg-brown: #FDF5E6;
            --wa-green: #25D366;
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-brown);
            color: #2c2c2c;
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            max-width: 700px;
            margin: 0 auto;
            background: #fff;
            box-shadow: 0 0 15px rgba(0,0,0,0.05);
            position: relative;
        }

        header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            border-bottom: 1px solid var(--light-brown);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-weight: bold;
            color: var(--primary-brown);
            font-size: 20px;
            letter-spacing: 0.5px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-post {
            text-decoration: none;
            background: var(--secondary-brown);
            color: #fff;
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        .btn-post:hover { opacity: 0.9; }

        /* Area Utama Direktori (Bukan Chat Bubbles) */
        #content-viewport {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .welcome-banner {
            background: linear-gradient(135deg, #FFF8DC, #FAEBD7);
            border: 1px solid var(--light-brown);
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 14.5px;
            line-height: 1.6;
            color: var(--primary-brown);
            font-weight: 500;
        }

        /* Search Bar & Filter Section */
        .search-control-box {
            background: #fff;
            border: 1px solid var(--light-brown);
            padding: 14px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .search-input-wrapper {
            display: flex;
            gap: 8px;
        }

        input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--light-brown);
            outline: none;
            font-size: 14px;
            background: #FFFAF0;
        }

        input:focus {
            border-color: var(--primary-brown);
            box-shadow: 0 0 0 2px rgba(139, 69, 19, 0.1);
        }

        button.search-btn {
            background: var(--primary-brown);
            color: #fff;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13.5px;
            transition: background 0.2s;
        }

        button.search-btn:hover { background: var(--secondary-brown); }

        /* Grid Kartu Informasi */
        .card-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .jasa-card {
            background: #fff;
            border: 1px solid var(--light-brown);
            border-left: 5px solid var(--primary-brown);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .jasa-card.ppv-premium {
            border-left: 5px solid #FFD700;
            background: linear-gradient(to right, #fffdf5, #fff);
        }

        .card-title {
            font-weight: bold;
            font-size: 16px;
            color: var(--primary-brown);
        }

        .card-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 4px;
            border: 1px solid #eee;
        }

        .card-desc {
            font-size: 13.5px;
            color: #444;
            line-height: 1.5;
            white-space: pre-line;
        }

        .card-meta {
            font-size: 13px;
            color: #666;
            margin-top: 4px;
        }

        .btn-wa {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--wa-green);
            color: #fff;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            margin-top: 8px;
            transition: background 0.2s;
        }

        .btn-wa:hover { background: #20ba56; }

        .info-faq {
            background: #fff;
            border: 1px dashed var(--light-brown);
            padding: 14px;
            border-radius: 8px;
            font-size: 14px;
            color: #555;
            line-height: 1.5;
        }

        .menu-btn {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 6px;
        }

        .menu-btn span {
            width: 22px;
            height: 2px;
            background: var(--primary-brown);
            border-radius: 2px;
        }

        .sidebar {
            position: absolute;
            top: 0;
            right: -280px;
            width: 280px;
            height: 100%;
            background: #fff;
            box-shadow: -4px 0 12px rgba(0,0,0,0.15);
            transition: right 0.3s ease;
            z-index: 99;
            padding: 70px 20px 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .sidebar.open { right: 0; }
        .sidebar h3 { font-size: 15px; color: var(--primary-brown); margin: 0 0 5px 0; border-bottom: 1px solid var(--light-brown); padding-bottom: 8px; }
        .sidebar p { font-size: 13px; color: #555; line-height: 1.6; margin: 0; }

        .loading-state {
            text-align: center;
            padding: 30px;
            color: var(--secondary-brown);
            font-style: italic;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div id="app">
    <header>
        <div class="logo">GOONA</div>
        <div class="header-right">
            <a href="tambah-info.html" class="btn-post">+ Posting</a>
            <div class="menu-btn" id="menu-btn">
                <span></span><span></span><span></span>
            </div>
        </div>
    </header>

    <div class="sidebar" id="sidebar">
        <h3>Aturan & Legalitas</h3>
        <p>Setiap informasi di Goona wajib akurat dan dapat dipertanggungjawabkan demi kenyamanan bersama.</p>
    </div>

    <main id="content-viewport">
        <!-- Banner Sambutan / Profil Pengguna -->
        <div class="welcome-banner" id="welcome-banner">
            Memuat informasi profil...
        </div>

        <!-- Kotak Pencarian Utama (Ganti Kotak Chat Bawah) -->
        <div class="search-control-box">
            <div style="font-size: 13px; font-weight: bold; color: var(--primary-brown);">Cari Kebutuhan / Jasa / Informasi:</div>
            <div class="search-input-wrapper">
                <input type="text" id="user-input" placeholder="Contoh: kue batam center...">
                <button class="search-btn" id="send-btn">Cari</button>
            </div>
        </div>

        <!-- Wadah Hasil Direktori Kartu -->
        <div id="result-container" class="card-grid">
            <div class="loading-state">Silakan ketik kata kunci pencarian di atas untuk mulai menjelajahi direktori.</div>
        </div>
    </main>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
import { dictionary } from './kosakata/kamus_tetap.js';

const SUPABASE_URL = 'https://ejnuelaqlgfcmcqpxmpa.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVqbnVlbGFxbGdmY21jcXB4bXBhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MzIzMjcsImV4cCI6MjA5MzMwODMyN30.32tG2nN1a3cDa6M__qe7PNWG5ZzeF7zs1eDZSxXviNM';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const inputField = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');
const resultContainer = document.getElementById('result-container');
const welcomeBanner = document.getElementById('welcome-banner');
const menuBtn = document.getElementById('menu-btn');
const sidebar = document.getElementById('sidebar');

let userIdentity = {
    nama: localStorage.getItem('goona_nama') || 'Pengguna',
    daerah: localStorage.getItem('goona_daerah') || 'Tanjungpinang'
};

function initAppUI() {
    welcomeBanner.innerHTML = `Halo <b>${userIdentity.nama}</b>! Menampilkan direktori pilihan untuk wilayah <b>${userIdentity.daerah}</b>. Gunakan kolom pencarian di bawah untuk menemukan informasi spesifik.`;
}

async function performSearch() {
    const prompt = inputField.value.trim();
    if (!prompt) return;

    resultContainer.innerHTML = `<div class="loading-state">Mencari informasi di direktori...</div>`;

    try {
        const semuaKata = prompt.toLowerCase().split(/\s+/).filter(word => word.length > 0);
        const kataKunci = [...new Set(semuaKata.filter(kata => kata.length > 2))];

        let query = supabase
            .from('konten_goona')
            .select('id, judul, deskripsi, whatsapp, kategori, kabupaten_kota, harga, satuan_harga, kecamatan, url_foto, tipe_konten')
            .or('and(status.eq.aktif,tipe_konten.eq.reguler),and(status_tayang.eq.true,tipe_konten.eq.ppv,sisa_kuota_ppv.gt.0)');
            
        kataKunci.forEach(kata => {
            query = query.or(`judul.ilike.*${kata}*,deskripsi.ilike.*${kata}*,kabupaten_kota.ilike.*${kata}*,kecamatan.ilike.*${kata}*`);
        });
        
        const { data, error } = await query;
        let searchData = error ? [] : (data || []);

        resultContainer.innerHTML = '';

        if (searchData.length === 0) {
            resultContainer.innerHTML = `<div class="info-faq">${dictionary.notFound}</div>`;
            return;
        }

        let kontenReguler = searchData.filter(item => item.tipe_konten === 'reguler' || !item.tipe_konten);
        let kontenPPV = searchData.filter(item => item.tipe_konten === 'ppv');
        let kontenFAQ = searchData.filter(item => item.kategori === 'FAQ');

        if (kontenPPV.length > 0) {
            kontenPPV.sort(() => 0.5 - Math.random());
            kontenPPV = kontenPPV.slice(0, 2);
        }

        let hasilAkhirTampil = [...kontenPPV, ...kontenReguler];
        let idIklanYangTayang = [];

        kontenFAQ.forEach(faq => {
            const faqDiv = document.createElement('div');
            faqDiv.className = 'info-faq';
            faqDiv.innerText = faq.deskripsi;
            resultContainer.appendChild(faqDiv);
        });

        hasilAkhirTampil.forEach(item => {
            let pakaiEmas = item.tipe_konten === 'ppv';
            if (pakaiEmas) idIklanYangTayang.push(item.id);

            let cleanPhone = item.whatsapp ? item.whatsapp.replace(/[^0-9]/g, '') : '';
            if (cleanPhone.startsWith('0')) cleanPhone = '62' + cleanPhone.substring(1);
            
            const encodedMsg = encodeURIComponent(`${dictionary.waTemplate} (${item.judul})`);
            
            let hargaTeks = "";
            if (item.harga) {
                const formatHarga = new Intl.NumberFormat('id-ID').format(item.harga);
                const satuan = item.satuan_harga ? ` / ${item.satuan_harga}` : "";
                hargaTeks = `<div class="card-meta"><b>${dictionary.priceLabel}</b> Rp ${formatHarga}${satuan}</div>`;
            }

            let lokasiGabungan = item.kabupaten_kota || "";
            if (item.kecamatan) lokasiGabungan += `, ${item.kecamatan}`;
            const lokasiTeks = lokasiGabungan ? `<div class="card-meta"><b>${dictionary.locLabel}</b> ${lokasiGabungan}</div>` : "";

            let komponenFoto = item.url_foto ? `<img src="${item.url_foto}" class="card-img" alt="${item.judul}" loading="lazy">` : "";

            const card = document.createElement('div');
            card.className = `jasa-card ${pakaiEmas ? 'ppv-premium' : ''}`;
            card.innerHTML = `
                ${komponenFoto}
                <div class="card-title">${item.judul}</div>
                <div class="card-desc">${item.deskripsi}</div>
                ${lokasiTeks}
                ${hargaTeks}
                <a href="https://wa.me/${cleanPhone}?text=${encodedMsg}" target="_blank" class="btn-wa">
                    💬 Hubungi via WhatsApp
                </a>
            `;
            resultContainer.appendChild(card);
        });

        if (idIklanYangTayang.length > 0) {
            await supabase.rpc('hitung_impresi_iklan', { iklan_ids: idIklanYangTayang });
        }

    } catch (err) {
        resultContainer.innerHTML = `<div class="info-faq">Maaf, terjadi kendala saat memuat data direktori.</div>`;
        console.error(err);
    }
}

menuBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    sidebar.classList.toggle('open');
});

document.addEventListener('click', (e) => {
    if (!sidebar.contains(e.target) && e.target !== menuBtn) {
        sidebar.classList.remove('open');
    }
});

window.addEventListener('DOMContentLoaded', () => {
    initAppUI();
    sendBtn.onclick = (e) => { e.preventDefault(); performSearch(); };
    inputField.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); performSearch(); } };
});
</script>
</body>
</html>
