<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GOONA — Mulai Langkahmu Sebagai Reviewer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* Motif batik geometris samar (kontras rendah agar tetap nyaman dipandang) */
    .batik-pattern {
      background-color: #f4f7f5;
      background-image:
        radial-gradient(circle at 25% 25%, rgba(16, 185, 129, 0.055) 0%, transparent 45%),
        radial-gradient(circle at 75% 75%, rgba(15, 118, 110, 0.05) 0%, transparent 45%),
        url("data:image/svg+xml,%3Csvg width='88' height='88' viewBox='0 0 88 88' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%230f766e' stroke-opacity='0.065' stroke-width='1'%3E%3Ccircle cx='44' cy='44' r='22'/%3E%3Ccircle cx='44' cy='44' r='11'/%3E%3Cpath d='M44 0 A22 22 0 0 1 66 22 A22 22 0 0 1 44 44 A22 22 0 0 1 22 22 A22 22 0 0 1 44 0 Z'/%3E%3Cpath d='M44 44 A22 22 0 0 1 66 66 A22 22 0 0 1 44 88 A22 22 0 0 1 22 66 A22 22 0 0 1 44 44 Z'/%3E%3Cpath d='M0 44 A22 22 0 0 1 22 22 A22 22 0 0 1 44 44 A22 22 0 0 1 22 66 A22 22 0 0 1 0 44 Z'/%3E%3Cpath d='M44 44 A22 22 0 0 1 66 22 A22 22 0 0 1 88 44 A22 22 0 0 1 66 66 A22 22 0 0 1 44 44 Z'/%3E%3C/g%3E%3C/svg%3E");
      background-size: 100% 100%, 100% 100%, 88px 88px;
    }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }

    @keyframes shimmerSweep {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(220%); }
    }

    .animate-float-slow {
      animation: floatSlow 4s ease-in-out infinite;
    }

    .shimmer-box {
      position: relative;
      overflow: hidden;
    }

    .shimmer-box::after {
      content: "";
      position: absolute;
      inset: 0;
      width: 45%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.55),
        transparent
      );
      animation: shimmerSweep 2.5s ease-in-out infinite;
    }
  </style>
</head>
<body class="batik-pattern h-dvh w-screen overflow-hidden text-slate-900 antialiased flex flex-col">
  <!-- Header: GOONA Proporsional + Tagline Utama + Jumlah Reviewer di Sudut Kanan Atas -->
  <header class="shrink-0 z-20 border-b border-slate-200/80 bg-white/88 backdrop-blur-md">
    <div class="mx-auto flex max-w-md items-center justify-between gap-2.5 px-4 py-2.5">
      <div class="min-w-0">
        <div class="text-[11px] font-bold tracking-[0.14em] uppercase text-emerald-700">
          GOONA
        </div>
        <h1 class="text-base font-extrabold leading-tight tracking-tight text-slate-900">
          Mulai Langkahmu Sebagai Reviewer
        </h1>
      </div>

      <div class="shrink-0 flex flex-col items-end gap-1">
        <a
          href="profil.html"
          class="animate-float-slow inline-flex items-center gap-1.5 rounded-full border border-emerald-200 bg-emerald-50/95 px-3 py-1.5 text-emerald-800 shadow-sm transition hover:bg-emerald-100"
          title="Jumlah Reviewer Terdaftar"
        >
          <i data-lucide="user-check" class="h-4 w-4 text-emerald-600"></i>
          <span id="reviewer-count" class="text-xs font-black tabular-nums">0</span>
        </a>
        <span id="daily-quota-label" class="text-[10px] font-semibold tabular-nums text-slate-500">
          Batas: 0/15 hari ini
        </span>
      </div>
    </div>

    <!-- Baris Filter (Muncul Saat Kampanye Sudah Ada) -->
    <div id="filter-bar" class="hidden mx-auto max-w-md px-4 pb-2.5">
      <div class="grid grid-cols-3 gap-1.5 rounded-xl bg-slate-100/90 p-1">
        <button
          type="button"
          data-filter="all"
          class="filter-btn rounded-lg bg-white py-1 text-[11px] font-bold text-slate-900 shadow-sm transition"
        >
          Semua
        </button>
        <button
          type="button"
          data-filter="eligible"
          class="filter-btn rounded-lg py-1 text-[11px] font-semibold text-slate-600 transition hover:text-slate-900"
        >
          Bisa Di-Review
        </button>
        <button
          type="button"
          data-filter="ineligible"
          class="filter-btn rounded-lg py-1 text-[11px] font-semibold text-slate-600 transition hover:text-slate-900"
        >
          Tidak Bisa
        </button>
      </div>
    </div>
  </header>

  <!-- Area Tengah: Kontainer Terkunci Tanpa Scroll Halaman Utama; Isi Di Dalam Bisa Di-Scroll -->
  <main id="feed-container" class="flex-1 min-h-0 overflow-y-auto mx-auto w-full max-w-md px-3.5 py-3 space-y-3">
    <!-- Keadaan Awal Formal Saat Belum Ada Layanan Untuk Di-Review -->
    <div class="rounded-3xl border border-slate-200/90 bg-white/90 p-4 shadow-sm text-center space-y-1.5">
      <div class="mx-auto flex h-9 w-9 items-center justify-center rounded-2xl bg-emerald-50 text-emerald-700">
        <i data-lucide="inbox" class="h-4 w-4"></i>
      </div>
      <p class="text-xs font-bold text-slate-800">
        Belum ada layanan yang tersedia untuk di-review.
      </p>
      <p class="text-[11px] text-slate-500">
        Maksimal 15 review per hari untuk setiap akun.
      </p>
    </div>

    <!-- Placeholder Kosong Yang Bisa Di-Scroll Ke Bawah -->
    <div class="rounded-3xl border border-dashed border-slate-300/90 bg-white/80 p-4 shadow-sm space-y-3">
      <div class="flex items-center justify-between">
        <span class="rounded-full bg-slate-100 px-2.5 py-0.5 text-[11px] font-bold text-slate-500">
          Slot #01
        </span>
        <span class="text-[11px] font-medium text-slate-400">Menunggu</span>
      </div>
      <div class="shimmer-box h-36 w-full rounded-2xl bg-slate-200/75 flex items-center justify-center text-slate-400">
        <i data-lucide="image" class="h-7 w-7"></i>
      </div>
      <div class="space-y-2">
        <div class="shimmer-box h-3.5 w-2/3 rounded bg-slate-200/75"></div>
        <div class="shimmer-box h-3 w-full rounded bg-slate-100"></div>
        <div class="shimmer-box h-3 w-4/5 rounded bg-slate-100"></div>
      </div>
    </div>

    <div class="rounded-3xl border border-dashed border-slate-300/90 bg-white/80 p-4 shadow-sm space-y-3">
      <div class="flex items-center justify-between">
        <span class="rounded-full bg-slate-100 px-2.5 py-0.5 text-[11px] font-bold text-slate-500">
          Slot #02
        </span>
        <span class="text-[11px] font-medium text-slate-400">Menunggu</span>
      </div>
      <div class="shimmer-box h-36 w-full rounded-2xl bg-slate-200/75 flex items-center justify-center text-slate-400">
        <i data-lucide="image" class="h-7 w-7"></i>
      </div>
      <div class="space-y-2">
        <div class="shimmer-box h-3.5 w-3/5 rounded bg-slate-200/75"></div>
        <div class="shimmer-box h-3 w-full rounded bg-slate-100"></div>
        <div class="shimmer-box h-3 w-3/4 rounded bg-slate-100"></div>
      </div>
    </div>
  </main>

  <!-- Navigasi Bawah: 5 Ikon -->
  <nav class="shrink-0 z-20 border-t border-slate-200/90 bg-white/95 backdrop-blur-md">
    <div class="mx-auto flex max-w-md items-center justify-between px-3 py-2">
      <!-- 1. Icon Rumah -> index.html -->
      <a
        href="index.html"
        aria-label="Beranda"
        class="flex h-11 w-12 items-center justify-center rounded-2xl bg-emerald-50 text-emerald-700 transition"
      >
        <i data-lucide="home" class="h-5 w-5"></i>
      </a>

      <!-- 2. Icon Dompet -> dompet.html -->
      <a
        href="dompet.html"
        aria-label="Dompet"
        class="flex h-11 w-12 items-center justify-center rounded-2xl text-slate-500 transition hover:bg-slate-100 hover:text-slate-900"
      >
        <i data-lucide="wallet" class="h-5 w-5"></i>
      </a>

      <!-- 3. Icon Pasang Iklan -> iklan.html -->
      <a
        href="iklan.html"
        aria-label="Pasang Iklan"
        class="flex h-11 w-12 items-center justify-center rounded-2xl text-slate-500 transition hover:bg-slate-100 hover:text-slate-900"
      >
        <i data-lucide="plus-circle" class="h-5 w-5"></i>
      </a>

      <!-- 4. Icon Riwayat -> riwayat.html -->
      <a
        href="riwayat.html"
        aria-label="Riwayat Review"
        class="flex h-11 w-12 items-center justify-center rounded-2xl text-slate-500 transition hover:bg-slate-100 hover:text-slate-900"
      >
        <i data-lucide="history" class="h-5 w-5"></i>
      </a>

      <!-- 5. Icon Orang (Sudut Kanan Bawah) -> profil.html -->
      <a
        href="profil.html"
        aria-label="Profil"
        class="flex h-11 w-12 items-center justify-center rounded-2xl text-slate-500 transition hover:bg-slate-100 hover:text-slate-900"
      >
        <i data-lucide="user" class="h-5 w-5"></i>
      </a>
    </div>
  </nav>

  <script>
    lucide.createIcons();
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-analytics.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
    import {
      getFirestore,
      collection,
      doc,
      getDoc,
      getDocs,
      addDoc,
      query,
      where,
      limit,
      onSnapshot,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAa_EhwILQsTrJBKocpvT8gHTholmCLMTY",
      authDomain: "goona-app.firebaseapp.com",
      projectId: "goona-app",
      storageBucket: "goona-app.firebasestorage.app",
      messagingSenderId: "315162973072",
      appId: "1:315162973072:web:bd7244e1bfc13ce1ae1915",
      measurementId: "G-GXVPP73QCK"
    };

    const app = initializeApp(firebaseConfig);
    getAnalytics(app);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const DAILY_REVIEW_LIMIT = 15;
    const MAX_DESC_LENGTH = 150;

    let currentUser = null;
    let userProfile = null;
    let dailyReviewCount = 0;
    let activeFilter = "all";
    let campaigns = [];
    const activeTimers = new Map();

    function getTodayKey() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, "0");
      const d = String(now.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function escapeHtml(text = "") {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function sanitizeUrl(rawUrl = "") {
      try {
        const parsed = new URL(rawUrl);
        if (parsed.protocol === "https:" || parsed.protocol === "http:") {
          return parsed.href;
        }
      } catch {}
      return "";
    }

    function truncateDesc(text = "") {
      const clean = String(text).trim();
      if (!clean) return "Konten layanan perusahaan.";
      return clean.length > MAX_DESC_LENGTH
        ? clean.slice(0, MAX_DESC_LENGTH).trimEnd() + "..."
        : clean;
    }

    function updateDailyQuotaUi() {
      const el = document.getElementById("daily-quota-label");
      if (!el) return;
      el.textContent = `Batas: ${dailyReviewCount}/${DAILY_REVIEW_LIMIT} hari ini`;
    }

    async function loadDailyReviewCount(uid) {
      if (!uid) {
        dailyReviewCount = 0;
        updateDailyQuotaUi();
        return;
      }
      try {
        const today = getTodayKey();
        const q = query(
          collection(db, "reviews"),
          where("reviewerId", "==", uid),
          where("dateKey", "==", today)
        );
        const snap = await getDocs(q);
        dailyReviewCount = snap.size;
      } catch {
        dailyReviewCount = 0;
      }
      updateDailyQuotaUi();
    }

    function checkEligibility(data) {
      if (dailyReviewCount >= DAILY_REVIEW_LIMIT) {
        return {
          eligible: false,
          reason: `Batas harian tercapai (${DAILY_REVIEW_LIMIT}/${DAILY_REVIEW_LIMIT})`
        };
      }

      if (!currentUser) {
        return {
          eligible: false,
          reason: "Masuk akun untuk me-review"
        };
      }

      const targetCat = (data.kategori || data.category || "").toString().trim().toLowerCase();
      if (targetCat && targetCat !== "semua" && targetCat !== "all") {
        const userCat = (userProfile?.kategori || userProfile?.category || "").toString().trim().toLowerCase();
        if (!userCat || userCat !== targetCat) {
          return {
            eligible: false,
            reason: `Kategori belum sesuai (${data.kategori || data.category})`
          };
        }
      }

      return {
        eligible: true,
        reason: "Bisa di-review"
      };
    }

    function clearAllTimers() {
      activeTimers.forEach((id) => clearInterval(id));
      activeTimers.clear();
    }

    function renderCampaigns() {
      clearAllTimers();
      const container = document.getElementById("feed-container");
      const filterBar = document.getElementById("filter-bar");

      if (!campaigns.length) {
        filterBar.classList.add("hidden");
        return;
      }

      filterBar.classList.remove("hidden");

      const enriched = campaigns.map((docSnap) => {
        const data = docSnap.data() || {};
        return {
          id: docSnap.id,
          data,
          elig: checkEligibility(data)
        };
      });

      const filtered = enriched.filter((item) => {
        if (activeFilter === "eligible") return item.elig.eligible;
        if (activeFilter === "ineligible") return !item.elig.eligible;
        return true;
      });

      if (!filtered.length) {
        container.innerHTML = `
          <div class="rounded-3xl border border-slate-200 bg-white/90 p-5 text-center shadow-sm">
            <p class="text-xs font-bold text-slate-700">
              Tidak ada layanan pada filter ini.
            </p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered
        .map(({ id, data, elig }) => {
          const title = escapeHtml(data.judul || data.title || "Layanan Perusahaan");
          const desc = escapeHtml(truncateDesc(data.deskripsi || data.description || ""));
          const location = escapeHtml(data.lokasi || data.location || "Semua Wilayah");
          const category = escapeHtml(data.kategori || data.category || "Umum");
          const safeImg = sanitizeUrl(data.gambarUrl || data.imageUrl || data.gambar || "");
          const safeLink = sanitizeUrl(data.linkPenjualan || data.salesUrl || data.link || "");
          const question = escapeHtml(data.pertanyaan || data.question || "Apakah informasi layanan ini jelas?");
          const optA = escapeHtml(data.opsiA || data.optionA || "A. Ya, jelas");
          const optB = escapeHtml(data.opsiB || data.optionB || "B. Kurang jelas");

          const badgeClass = elig.eligible
            ? "bg-emerald-50 text-emerald-700 border-emerald-200"
            : "bg-slate-100 text-slate-600 border-slate-200";

          return `
            <article data-card-id="${escapeHtml(id)}" class="rounded-3xl border border-slate-200/90 bg-white/95 p-3.5 shadow-sm space-y-2.5">
              <div class="flex items-center justify-between gap-2">
                <span class="rounded-full bg-slate-100 px-2.5 py-0.5 text-[11px] font-bold text-slate-700">
                  ${category}
                </span>
                <span class="truncate rounded-full border px-2.5 py-0.5 text-[11px] font-bold ${badgeClass}">
                  ${escapeHtml(elig.reason)}
                </span>
              </div>

              ${
                safeImg
                  ? `<div class="h-44 w-full overflow-hidden rounded-2xl bg-slate-100 border border-slate-200/70">
                       <img src="${safeImg}" alt="${title}" class="h-full w-full object-cover" loading="lazy" />
                     </div>`
                  : ""
              }

              <div class="space-y-1">
                <h2 class="text-sm font-extrabold text-slate-900">${title}</h2>
                <p class="text-xs leading-relaxed text-slate-600">${desc}</p>
                <div class="flex items-center justify-between gap-2 pt-1 text-[11px]">
                  <span class="inline-flex items-center gap-1 font-medium text-slate-500 truncate">
                    <i data-lucide="map-pin" class="h-3.5 w-3.5 text-emerald-600 shrink-0"></i>
                    <span class="truncate">${location}</span>
                  </span>
                  ${
                    safeLink
                      ? `<a href="${safeLink}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 font-bold text-emerald-700 hover:underline shrink-0">
                           <span>Link Penjualan</span>
                           <i data-lucide="external-link" class="h-3 w-3"></i>
                         </a>`
                      : ""
                  }
                </div>
              </div>

              <div class="rounded-2xl border border-slate-200/80 bg-slate-50/90 p-2.5 space-y-2">
                <div class="flex items-center justify-between gap-2">
                  <span class="text-[11px] font-bold text-slate-800">${question}</span>
                  <span data-timer-badge class="shrink-0 rounded-full bg-amber-100 px-2 py-0.5 text-[10px] font-bold tabular-nums text-amber-800">
                    ${elig.eligible ? "7d" : "Terkunci"}
                  </span>
                </div>
                <div class="grid grid-cols-2 gap-2">
                  <button
                    type="button"
                    data-choice="A"
                    disabled
                    class="choice-btn rounded-xl border border-slate-300 bg-white px-2.5 py-2 text-left text-xs font-bold text-slate-800 transition hover:border-emerald-500 hover:bg-emerald-50 disabled:opacity-50 disabled:cursor-not-allowed truncate"
                  >
                    ${optA}
                  </button>
                  <button
                    type="button"
                    data-choice="B"
                    disabled
                    class="choice-btn rounded-xl border border-slate-300 bg-white px-2.5 py-2 text-left text-xs font-bold text-slate-800 transition hover:border-emerald-500 hover:bg-emerald-50 disabled:opacity-50 disabled:cursor-not-allowed truncate"
                  >
                    ${optB}
                  </button>
                </div>
                <div data-status-msg class="min-h-[15px] text-[11px] font-semibold text-slate-500"></div>
              </div>
            </article>
          `;
        })
        .join("");

      lucide.createIcons();

      container.querySelectorAll("article[data-card-id]").forEach((card) => {
        const cardId = card.getAttribute("data-card-id");
        const found = filtered.find((x) => x.id === cardId);
        if (!found || !found.elig.eligible) return;

        let remaining = 7;
        const badge = card.querySelector("[data-timer-badge]");
        const buttons = card.querySelectorAll(".choice-btn");
        const statusMsg = card.querySelector("[data-status-msg]");

        const timerId = setInterval(() => {
          remaining -= 1;
          if (badge) {
            badge.textContent = remaining > 0 ? `${remaining}d` : "Siap";
            if (remaining <= 0) {
              badge.className = "shrink-0 rounded-full bg-emerald-100 px-2 py-0.5 text-[10px] font-bold text-emerald-700";
            }
          }
          if (remaining <= 0) {
            clearInterval(timerId);
            activeTimers.delete(cardId);
            buttons.forEach((btn) => {
              btn.disabled = false;
            });
          }
        }, 1000);

        activeTimers.set(cardId, timerId);

        buttons.forEach((btn) => {
          btn.addEventListener("click", async () => {
            if (!currentUser || dailyReviewCount >= DAILY_REVIEW_LIMIT) return;
            const choice = btn.getAttribute("data-choice");
            buttons.forEach((b) => (b.disabled = true));

            try {
              await addDoc(collection(db, "reviews"), {
                campaignId: cardId,
                reviewerId: currentUser.uid,
                answer: choice,
                dateKey: getTodayKey(),
                createdAt: serverTimestamp()
              });
              dailyReviewCount += 1;
              updateDailyQuotaUi();
              if (statusMsg) {
                statusMsg.className = "min-h-[15px] text-[11px] font-bold text-emerald-700";
                statusMsg.textContent = `Pilihan ${choice} tersimpan (${dailyReviewCount}/${DAILY_REVIEW_LIMIT} hari ini).`;
              }
            } catch {
              if (statusMsg) {
                statusMsg.className = "min-h-[15px] text-[11px] font-bold text-rose-600";
                statusMsg.textContent = "Gagal menyimpan review.";
              }
            }
          });
        });
      });
    }

    document.querySelectorAll(".filter-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        activeFilter = btn.getAttribute("data-filter") || "all";
        document.querySelectorAll(".filter-btn").forEach((b) => {
          const isActive = b === btn;
          b.className = isActive
            ? "filter-btn rounded-lg bg-white py-1 text-[11px] font-bold text-slate-900 shadow-sm transition"
            : "filter-btn rounded-lg py-1 text-[11px] font-semibold text-slate-600 transition hover:text-slate-900";
        });
        renderCampaigns();
      });
    });

    function listenReviewerCount() {
      const countEl = document.getElementById("reviewer-count");
      try {
        const q = query(collection(db, "users"), where("role", "==", "reviewer"));
        onSnapshot(
          q,
          (snap) => {
            countEl.textContent = Number(snap.size || 0).toLocaleString("id-ID");
          },
          () => {
            countEl.textContent = "0";
          }
        );
      } catch {
        countEl.textContent = "0";
      }
    }

    async function loadCampaigns() {
      try {
        const q = query(collection(db, "campaigns"), where("status", "==", "active"), limit(30));
        const snap = await getDocs(q);
        campaigns = snap.docs;
        if (campaigns.length > 0) {
          renderCampaigns();
        }
      } catch {
        campaigns = [];
      }
    }

    onAuthStateChanged(auth, async (user) => {
      currentUser = user;
      userProfile = null;
      if (user) {
        try {
          const userSnap = await getDoc(doc(db, "users", user.uid));
          if (userSnap.exists()) userProfile = userSnap.data();
        } catch {}
        await loadDailyReviewCount(user.uid);
      } else {
        dailyReviewCount = 0;
        updateDailyQuotaUi();
      }
      if (campaigns.length > 0) {
        renderCampaigns();
      }
    });

    listenReviewerCount();
    loadCampaigns();
  </script>
</body>
</html>
